# Declarative Automation Bundle (DAB) — Tesla Telemetry ETL Pipeline
# Deploy: databricks bundle deploy --target prod
# Validate: databricks bundle validate --target dev

bundle:
  name: tesla-telemetry

variables:
  notebook_root:
    description: Base path for Tesla telemetry notebooks
    default: /Workspace/Users/masoomgupta0715@gmail.com/tesla_telemetry

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production

resources:
  jobs:
    tesla_telemetry_pipeline:
      name: Tesla Telemetry ETL Pipeline

      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: UTC
        pause_status: PAUSED

      max_concurrent_runs: 1
      max_retries: 1
      min_retry_interval_millis: 300000
      retry_on_failure: true

      email_notifications:
        on_failure:
          - masoomgupta0715@gmail.com
        no_alert_for_skipped_runs: true

      queue:
        enabled: true

      tasks:
        - task_key: generate_telemetry
          notebook_task:
            notebook_path: ${var.notebook_root}/01_generate_telemetry
            source: WORKSPACE
          email_notifications:
            on_failure:
              - masoomgupta0715@gmail.com

        - task_key: bronze
          depends_on:
            - task_key: generate_telemetry
          notebook_task:
            notebook_path: ${var.notebook_root}/02_bronze_batch
            source: WORKSPACE
          email_notifications:
            on_failure:
              - masoomgupta0715@gmail.com

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ${var.notebook_root}/03_silver
            source: WORKSPACE
          email_notifications:
            on_failure:
              - masoomgupta0715@gmail.com

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ${var.notebook_root}/04_gold
            source: WORKSPACE
          email_notifications:
            on_failure:
              - masoomgupta0715@gmail.com

        - task_key: load_snowflake
          depends_on:
            - task_key: gold
          notebook_task:
            notebook_path: ${var.notebook_root}/05_load_snowflake
            source: WORKSPACE
          email_notifications:
            on_failure:
              - masoomgupta0715@gmail.com

    tesla_telemetry_1m_test:
      name: Tesla Telemetry ETL Pipeline - 1M Test
      max_concurrent_runs: 1
      max_retries: 1
      min_retry_interval_millis: 300000
      retry_on_failure: true
      email_notifications:
        on_failure:
          - masoomgupta0715@gmail.com
        no_alert_for_skipped_runs: true
      queue:
        enabled: true
      tasks:
        - task_key: generate_telemetry
          notebook_task:
            notebook_path: ${var.notebook_root}/01_generate_telemetry_1m
            source: WORKSPACE
          email_notifications:
            on_failure:
              - masoomgupta0715@gmail.com
        - task_key: bronze
          depends_on:
            - task_key: generate_telemetry
          notebook_task:
            notebook_path: ${var.notebook_root}/02_bronze_batch
            source: WORKSPACE
          email_notifications:
            on_failure:
              - masoomgupta0715@gmail.com
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ${var.notebook_root}/03_silver
            source: WORKSPACE
          email_notifications:
            on_failure:
              - masoomgupta0715@gmail.com
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ${var.notebook_root}/04_gold_incremental
            source: WORKSPACE
          email_notifications:
            on_failure:
              - masoomgupta0715@gmail.com
        - task_key: load_snowflake
          depends_on:
            - task_key: gold
          notebook_task:
            notebook_path: ${var.notebook_root}/05_load_snowflake_incremental
            source: WORKSPACE
          email_notifications:
            on_failure:
              - masoomgupta0715@gmail.com